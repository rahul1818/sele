name: Daily Selenium

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to run tests
        required: true
        default: uat
        type: choice
        options:
          - uat
          - production

jobs:
  test:
    name: Selenium (${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'uat' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Show Chrome
        run: google-chrome --version

      - name: Resolve environment
        id: env
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          else
            ENV="uat"
          fi
          # Map UI names → -Denv property files (staging.properties / production.properties)
          if [ "$ENV" = "production" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
            echo "artifact=selenium-report" >> "$GITHUB_OUTPUT"
          else
            echo "env=staging" >> "$GITHUB_OUTPUT"
            echo "artifact=selenium-report-uat" >> "$GITHUB_OUTPUT"
          fi
          echo "Running environment: $ENV"

      - name: Run Selenium suite
        run: mvn -B clean test -Denv=${{ steps.env.outputs.env }} -Dheadless=true

      - name: Upload report for QAMind Hub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.env.outputs.artifact }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
